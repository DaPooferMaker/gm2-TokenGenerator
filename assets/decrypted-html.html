<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                display:flex;
                flex-direction: column; 
                justify-content: center;
                align-items:center; 
            }
        </style>
    </head>
    <body>
        <div style="height:5vh;">
            <select name="time" id="time-selector">
                <option value="">--Please choose an option--</option>
                <option value="1 hour">1 hour</option>
                <option value="1 day" selected>1 day</option>
                <option value="1 week">1 week</option>
                <option value="2 weeks">2 weeks</option>
                <option value="1 month">1 month</option>
                <option value="2 months">2 months</option>
                <option value="3 months">3 months</option>
                <option value="1 year">1 year</option>
                <option value="inf">Infinite</option>
            </select>
            <button onclick="GenerateToken()"> Generate Token </button>  
        </div>
        <textarea id="TokenAnswer" style="width:60vw"></textarea>
        <script>
            const dropdown = document.getElementById('time-selector');
            dropdown.addEventListener('change', (event) => {
                // Gets the 'value' attribute (e.g., "banana")
                const selectedValue = event.target.value; 

                // Gets the visible display text (e.g., "Banana")
                const selectedText = event.target.options[event.target.selectedIndex].text;

                console.log('Value:', selectedValue);
                console.log('Text:', selectedText);
            });

            function generateRandomString(length = 8) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
            }

            const BASE32ALTHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

            function base32Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let bits = 0;
            let value = 0;
            let output = '';

            for (let i = 0; i < bytes.length; i++) {
                value = (value << 8) | bytes[i];
                bits += 8;

                while (bits >= 5) {
                output += BASE32ALTHABET[(value >>> (bits - 5)) & 31];
                bits -= 5;
                }
            }

            if (bits > 0) {
                output += BASE32ALTHABET[(value << (5 - bits)) & 31];
            }

            while (output.length % 8 !== 0) {
                output += '=';
            }

            return output;
            }

            function base32Decode(base32) {
            const cleanInput = base32.replace(/=+$/, '').toUpperCase();
            let bits = 0;
            let value = 0;
            const bytes = [];

            for (let i = 0; i < cleanInput.length; i++) {
                const idx = BASE32ALTHABET.indexOf(cleanInput[i]);
                if (idx === -1) {
                throw new Error(`Invalid Base32 character: ${cleanInput[i]}`);
                }

                value = (value << 5) | idx;
                bits += 5;

                if (bits >= 8) {
                bytes.push((value >>> (bits - 8)) & 255);
                bits -= 8;
                }
            }

            return new TextDecoder().decode(new Uint8Array(bytes));
            }

            console.log(generateRandomString()); // Example: "a8F9kL2z"

            function GenerateToken(){
                TokenTextAnswer = document.getElementById("TokenAnswer")
                const TokenDict = {
                    "Duration":dropdown.value,
                    "PublicId":generateRandomString(8),
                    "TimeOfCreation":Math.floor(Date.now() / 1000)
                }
                TokenTextAnswer.value = JSON.stringify(TokenDict, null, 2)
                console.log(base32Encode(btoa(TokenTextAnswer.value)))
            }
        </script>
    </body>
</html>
